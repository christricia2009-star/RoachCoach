name: Roach Coach Radar - Signal Pipeline

on:
  schedule:
    # Every 2 hours, not every 15 minutes. Camera vision + 14 web
    # searches at */15 was ~$1/run and ~$96/day.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Reconstruct CloudKit private key from secret
        run: |
          echo "${{ secrets.CLOUDKIT_PRIVATE_KEY_B64 }}" | base64 --decode > /tmp/cloudkit_key.pem

      - name: Run signal pipeline once
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          LLM_STRATEGY: ${{ secrets.LLM_STRATEGY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}

          CLOUDKIT_CONTAINER_ID: ${{ secrets.CLOUDKIT_CONTAINER_ID }}
          CLOUDKIT_ENVIRONMENT: ${{ secrets.CLOUDKIT_ENVIRONMENT }}
          CLOUDKIT_SERVER_KEY_ID: ${{ secrets.CLOUDKIT_SERVER_KEY_ID }}
          CLOUDKIT_SERVER_PRIVATE_KEY: ${{ secrets.CLOUDKIT_SERVER_PRIVATE_KEY }}


          HOME_BASE_LATITUDE: ${{ secrets.HOME_BASE_LATITUDE }}
          HOME_BASE_LONGITUDE: ${{ secrets.HOME_BASE_LONGITUDE }}

          TELECOM_API_KEY: ${{ secrets.TELECOM_API_KEY }}
          TELECOM_API_BASE_URL: ${{ secrets.TELECOM_API_BASE_URL }}

          UBER_PARTNER_CLIENT_ID: ${{ secrets.UBER_PARTNER_CLIENT_ID }}
          UBER_PARTNER_CLIENT_SECRET: ${{ secrets.UBER_PARTNER_CLIENT_SECRET }}
          UBER_PARTNER_API_BASE_URL: ${{ secrets.UBER_PARTNER_API_BASE_URL }}

          DOORDASH_PARTNER_API_KEY: ${{ secrets.DOORDASH_PARTNER_API_KEY }}
          DOORDASH_PARTNER_API_BASE_URL: ${{ secrets.DOORDASH_PARTNER_API_BASE_URL }}

          # Optional. If unset, Instagram/X native APIs skip and
          # OpenRouter web search still checks instagram.com / x.com.
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}

          # Cost controls (empty = cheapest). Set secret to "true" to enable.
          RUN_CAMERA_VISION: ${{ secrets.RUN_CAMERA_VISION }}
          PER_TRUCK_WEB_SEARCH: ${{ secrets.PER_TRUCK_WEB_SEARCH }}
          SKIP_DUCKDUCKGO: "1"

        run: |
          cd backend
          # GitHub injects missing secrets as empty strings, which
          # overrides Python defaults. Force OpenRouter + Luna when blank.
          export LLM_PROVIDER="${LLM_PROVIDER:-openrouter}"
          export LLM_STRATEGY="${LLM_STRATEGY:-single}"
          export LLM_MODEL="${LLM_MODEL:-openai/gpt-5.6-luna}"
          python3 scheduler.py --once
